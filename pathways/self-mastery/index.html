<!doctype html>
<html lang="en" data-page="article">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#091c1b" />
    <script>
      try {
        const theme = localStorage.getItem('mentis-theme') === 'dark' ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'light' ? '#fbf5e7' : '#091c1b';
      } catch { /* Use the light palette when storage is unavailable. */ }
    </script>
    <meta name="description" content="Evidence-based tools to build focus, resilience, and mental clarity. Core Pathway 02 from Mentis Forge." />
    <title>Self-Mastery | Mentis Forge</title>
  </head>

  </body>
